name: Changhong diagnostic APK
on:
  push:
    branches: [changhong-home-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated test package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          gradle = Path('app/build.gradle.kts')
          source = gradle.read_text()
          original_id = 'applicationId = "app.orchard.tv"'
          test_id = 'applicationId = "app.orchard.tv.changhongtest"'
          assert source.count(original_id) == 1
          gradle.write_text(source.replace(original_id, test_id))

          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          ET.register_namespace('tools', 'http://schemas.android.com/tools')
          manifest = Path('app/src/main/AndroidManifest.xml')
          tree = ET.parse(manifest)
          application = tree.getroot().find('application')
          application.set(f'{{{android}}}label', 'Aerial Changhong Test')
          excluded = {'.guard.BootReceiver', '.guard.RevivalListener',
                      '.guard.RevivalSyncService', '.guard.RevivalAccountService'}
          for component in list(application):
              name = component.get(f'{{{android}}}name')
              if name in excluded:
                  application.remove(component)
              elif name == '.guard.HomeGuardService':
                  component.set(f'{{{android}}}label', 'Aerial Changhong Test Guard')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY
      - name: Build and verify Android 5.1 compatibility
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash gradlew --no-daemon -Pdiag :app:assembleGuardRelease
          cp app/build/outputs/apk/guard/release/*.apk aerial-changhong-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 22 --print-certs aerial-changhong-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging aerial-changhong-test.apk | grep -E "^package:|^sdkVersion:"
      - uses: actions/upload-artifact@v4
        with:
          name: aerial-changhong-test
          path: aerial-changhong-test.apk
          if-no-files-found: error
